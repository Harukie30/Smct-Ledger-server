services:
    ledger-server:
        build:
            context: ./
            dockerfile: Dockerfile
        image: ledger-server
        container_name: ledger-server
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - /home/webserver/systems/Ledger/Ledger-server/.env:/var/www/.env
            - ./:/var/www
            - ./nginx/default.conf:/etc/nginx/nginx.conf
          #  - /mnt/nvme0n1/ledger-uploads:/var/www/storage/app/public

        networks:
            - ledger-network
        environment:
            DB_CONNECTION: mysql
            DB_HOST: 172.17.0.1
            DB_PORT: 3306
            DB_DATABASE: ledger
            DB_USERNAME: smct
            DB_PASSWORD: smct
            REVERB_HOST: ledger-reverb
            REVERB_PORT: 8086
            REVERB_SCHEME: http
        # command: php artisan queue:listen --tries=1

    ledger-nginx:
        image: nginx:alpine
        container_name: ledger-nginx
        restart: unless-stopped
        ports:
            - 7071:7071
        volumes:
            - ./nginx/default.conf:/etc/nginx/nginx.conf
            - ./:/var/www
          #  - /mnt/nvme0n1/ledger-uploads:/var/www/storage/app/public

        networks:
            - ledger-network

    ledger-reverb:
        build:
            context: ./
            dockerfile: Dockerfile-reverb
        ports:
            - "8086:8086" # expose Reverb server
        environment:
            - APP_URL=${APP_URL}
            - LARAVEL_REVERB_APP_KEY=${REVERB_APP_KEY}
            - LARAVEL_REVERB_APP_SECRET=${REVERB_APP_SECRET}
        depends_on:
            - ledger-server
        restart: unless-stopped
        container_name: ledger-reverb

        networks:
            - ledger-network

    ledger-worker:
        image: ledger-server
        container_name: ledger-server-worker
        working_dir: /var/www/
        depends_on:
            - ledger-server
        command: php artisan queue:work --tries=3
        volumes:
            - ./storage:/var/www/storage
            - ./bootstrap/cache:/var/www/bootstrap/cache
            - /home/webserver/systems/Ledger/Ledger-server/.env:/var/www/.env
            - ./:/var/www
        networks:
            - ledger-network
        restart: unless-stopped
        environment:
            REVERB_HOST: ledger-reverb
            REVERB_PORT: 8086
            REVERB_SCHEME: http

